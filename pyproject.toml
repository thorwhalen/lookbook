[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lookbook"]
# `artifacts` ships non-Python data files inside the package without
# duplicating the auto-included .py files (which `force-include` of the
# whole directory would). Bundles the shipped YAML profiles.
artifacts = ["lookbook/profiles/*.yaml"]

[project]
name = "lookbook"
version = "0.0.7"
description = "Distill raw image pools into optimized, high-diversity reference sets for character model training."
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "Pillow>=10",
    "numpy>=1.26",
    "dol",
    "meshed",
    "config2py",
    "argh>=0.30",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.license]
text = "mit"

[project.scripts]
lookbook = "lookbook.__main__:main"

[project.urls]
Homepage = "https://github.com/thorwhalen/lookbook"
Repository = "https://github.com/thorwhalen/lookbook"
Documentation = "https://thorwhalen.github.io/lookbook"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
# Phase 1+: cheap funnel — perceptual hash, OpenCV-based blur/exposure.
funnel = [
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "imagededup>=0.3.2",
]
# Phase 2+: embeddings, IQA models, submodular selection. Pulls torch.
embed = [
    "torch>=2.1",
    "open-clip-torch>=2.24",
    "transformers>=4.40",
    "pyiqa>=0.1.13",
    "apricot-select>=0.6.1",
    "scikit-learn>=1.4",
]
# Phase 3+: person-LoRA-specific.
person = [
    "insightface>=0.7.3",
    "sixdrepnet>=0.1.6",
    "mediapipe>=0.10",
]
# Phase 4: HTTP surface via qh.
http = [
    "qh",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# Phase 5: MCP surface via fastmcp.
mcp = [
    "fastmcp>=3.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
